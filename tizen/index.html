<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UgisF1</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="brand-f1">F1</span> <span class="brand-name">UgisF1</span></div>
      <div id="crumb"></div>
      <div id="clock"></div>
    </header>
    <main id="screen"></main>
  </div>

  <div id="player" class="hidden">
    <video id="video" autoplay></video>
    <div id="player-spinner" class="spinner hidden"></div>
    <div id="player-osd" class="hidden">
      <div class="osd-title" id="osd-title"></div>
      <div class="osd-sub" id="osd-sub"></div>
      <div class="osd-progress"><div class="osd-bar" id="osd-bar"></div></div>
      <div class="osd-time"><span id="osd-pos"></span><span id="osd-live" class="live-badge hidden">LIVE</span><span id="osd-dur"></span></div>
      <div class="osd-hints">
        <span><b>OK</b> Play/Pause</span>
        <span><b>&#9664; &#9654;</b> Seek</span>
        <span><b>&#9650; &#9660;</b> / <b>CH</b> Switch feed</span>
        <span><i class="key green"></i> Feeds</span>
        <span><i class="key yellow"></i> Audio</span>
        <span><i class="key blue"></i> Quality</span>
        <span><b>BACK</b> Exit</span>
      </div>
    </div>
    <div id="player-panel" class="hidden"></div>
  </div>

  <div id="toast" class="hidden"></div>

  <!-- Samsung TV platform APIs (screensaver control). 404s harmlessly in a desktop browser. -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <script src="js/lib/shaka-player.compiled.js"></script>
  <!-- Optional, git-ignored build-time defaults; copy js/local.example.js to js/local.js. -->
  <script src="js/local.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
